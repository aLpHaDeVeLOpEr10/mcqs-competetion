; /etc/supervisor/conf.d/mcq.conf  → supervisorctl reread && supervisorctl update
;
; All processes run as www-data from the "current" release symlink. After a deploy, workers are
; restarted gracefully with `php artisan queue:restart` (each finishes its current job first), and
; Supervisor starts them again on the new code. stopwaitsecs is longer than each --timeout so a
; stop never kills a job mid-way.

[group:mcq]
programs=mcq-reverb,mcq-worker-engine,mcq-worker-default,mcq-worker-long

; WebSockets. Listens on 127.0.0.1:8080 only (REVERB_SERVER_HOST/PORT); nginx terminates TLS.
[program:mcq-reverb]
command=/usr/bin/php /var/www/mcq/current/artisan reverb:start --no-interaction
directory=/var/www/mcq/current
user=www-data
autostart=true
autorestart=true
startsecs=3
stopsignal=TERM
stopwaitsecs=15
minfds=10000                         ; one file descriptor per open WebSocket
stdout_logfile=/var/log/mcq/reverb.log
stderr_logfile=/var/log/mcq/reverb.error.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5

; Competition engine wake-ups: short, latency-sensitive. Several processes so one slow job never delays another room.
[program:mcq-worker-engine]
command=/usr/bin/php /var/www/mcq/current/artisan queue:work database --queue=competition --tries=5 --timeout=30 --sleep=1 --max-time=3600 --memory=256
process_name=%(program_name)s_%(process_num)02d
numprocs=2
directory=/var/www/mcq/current
user=www-data
autostart=true
autorestart=true
startsecs=1
stopwaitsecs=60
stdout_logfile=/var/log/mcq/worker-engine.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
redirect_stderr=true

; Notifications (email, room notices), prize payments.
[program:mcq-worker-default]
command=/usr/bin/php /var/www/mcq/current/artisan queue:work database --queue=default --tries=5 --timeout=60 --sleep=2 --max-time=3600 --memory=256
process_name=%(program_name)s_%(process_num)02d
numprocs=2
directory=/var/www/mcq/current
user=www-data
autostart=true
autorestart=true
startsecs=1
stopwaitsecs=90
stdout_logfile=/var/log/mcq/worker-default.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
redirect_stderr=true

; CSV exports and announcements (up to 15 minutes; separate connection whose retry_after is 1000 s).
[program:mcq-worker-long]
command=/usr/bin/php /var/www/mcq/current/artisan queue:work database-long --queue=long --tries=3 --timeout=900 --sleep=5 --max-time=7200 --memory=512
process_name=%(program_name)s_%(process_num)02d
numprocs=1
directory=/var/www/mcq/current
user=www-data
autostart=true
autorestart=true
startsecs=1
stopwaitsecs=960
stdout_logfile=/var/log/mcq/worker-long.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
redirect_stderr=true
