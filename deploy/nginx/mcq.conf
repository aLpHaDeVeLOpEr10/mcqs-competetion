# /etc/nginx/sites-available/mcq.conf  (symlink into sites-enabled, then: nginx -t && systemctl reload nginx)
#
# Replace quiz.example.com with the real host everywhere. TLS certificates are obtained with
# certbot (see docs/DEPLOYMENT.md §6). Until the certificate exists, use only the port-80
# server block WITHOUT the redirect, run certbot, then enable this full file.
#
# Layout: /var/www/mcq/current -> /var/www/mcq/releases/<timestamp>  (document root: current/public)
# Reverb (WebSockets) listens on 127.0.0.1:8080 only and is reached through /app and /apps below.

limit_req_zone $binary_remote_addr zone=mcq_req:20m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=mcq_conn:20m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name quiz.example.com;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name quiz.example.com;

    ssl_certificate     /etc/letsencrypt/live/quiz.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quiz.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/mcq/current/public;
    index index.php;
    charset utf-8;
    server_tokens off;

    # Request limits. Uploads are at most 2 MB (question images, CSV imports).
    client_max_body_size 4m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;

    # Generous per-IP limits: whole classrooms / campuses may share one IP (NAT), so these only
    # stop floods. Fine-grained limits (login, answers, money) are enforced by the application.
    limit_req zone=mcq_req burst=120 nodelay;
    limit_conn mcq_conn 200;
    limit_req_status 429;
    limit_conn_status 429;

    # Security headers (CSP, nosniff, frame, referrer, HSTS) are sent by the application
    # (App\Http\Middleware\SecurityHeaders). Static files bypass PHP, so give them the basics.
    add_header X-Content-Type-Options "nosniff" always;

    # Never serve dotfiles (.env, .git, …) or anything outside public/.
    location ~ /\.(?!well-known) { deny all; return 404; }

    # Vite assets have content hashes in their names: cache for a year.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(?:ico|png|svg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # Laravel Reverb: WebSocket connections (/app/{key}) and the server-to-server HTTP API (/apps/{id}).
    location ~ ^/apps?/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        limit_req off;
        proxy_pass http://127.0.0.1:8080;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Only the front controller is executed; any other .php file under public/ is refused.
    location = /index.php {
        fastcgi_pass unix:/run/php/php8.3-fpm-mcq.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;
        fastcgi_param HTTPS on;          # TLS terminates here, so Laravel sees a secure request (HSTS, secure cookies)
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ \.php$ { return 404; }

    error_page 404 /index.php;
    access_log /var/log/nginx/mcq.access.log;
    error_log  /var/log/nginx/mcq.error.log warn;
}
