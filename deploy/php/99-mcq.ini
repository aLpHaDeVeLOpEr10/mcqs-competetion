; /etc/php/8.3/fpm/conf.d/99-mcq.ini  AND  /etc/php/8.3/cli/conf.d/99-mcq.ini
; (the CLI copy matters: queue workers, the scheduler and Reverb run on the CLI)

expose_php = Off
display_errors = Off
log_errors = On
date.timezone = UTC                   ; the application stores UTC and displays Asia/Karachi itself

; OPcache: measured up to ~45% faster page rendering (docs/PERFORMANCE.md).
opcache.enable = 1
opcache.enable_cli = 1                ; long-running CLI processes (workers, Reverb) benefit too
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20000
; Releases are new directories behind a symlink, so files never change in place:
; timestamps need not be checked, and php-fpm is reloaded on each deploy.
opcache.validate_timestamps = 0
opcache.save_comments = 1

realpath_cache_size = 4096K
realpath_cache_ttl = 600

session.use_strict_mode = 1
