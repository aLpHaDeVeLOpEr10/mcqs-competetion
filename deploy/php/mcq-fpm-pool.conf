; /etc/php/8.3/fpm/pool.d/mcq.conf — a dedicated pool for this application.
; Runs as www-data (read-only on the code; writes only storage/ and bootstrap/cache/).
[mcq]
user = www-data
group = www-data
listen = /run/php/php8.3-fpm-mcq.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Size pm.max_children to RAM: roughly (RAM for PHP) / (average worker memory, ~60–80 MB).
pm = dynamic
pm.max_children = 32
pm.start_servers = 8
pm.min_spare_servers = 4
pm.max_spare_servers = 12
pm.max_requests = 1000
request_terminate_timeout = 65s

; Do not let PHP-FPM workers see the whole environment; Laravel reads its own .env.
clear_env = yes

php_admin_value[error_log] = /var/log/php8.3-fpm-mcq.log
php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off
php_admin_value[memory_limit] = 256M
php_admin_value[upload_max_filesize] = 4M
php_admin_value[post_max_size] = 6M
php_admin_value[max_execution_time] = 60
; Limit file access to the application and the system temp directory.
php_admin_value[open_basedir] = /var/www/mcq/:/tmp/:/usr/share/php/
